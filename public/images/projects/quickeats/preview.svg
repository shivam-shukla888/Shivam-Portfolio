<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" fill="none">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Editorial Background Frame -->
  <rect width="1280" height="800" fill="url(#bg-dark)"/>
  <rect x="0" y="0" width="1280" height="800" stroke="#1E293B" stroke-width="1"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="1180" cy="120" r="280" fill="#059669" opacity="0.08" filter="blur(80px)"/>
  <circle cx="100" cy="700" r="240" fill="#F59E0B" opacity="0.05" filter="blur(80px)"/>

  <!-- Browser Window Mockup Container -->
  <g transform="translate(60, 48)" filter="url(#card-shadow)">
    <!-- Window Outer Frame -->
    <rect width="1160" height="704" rx="16" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="1160" height="44" rx="16" fill="#111827"/>
    <rect y="28" width="1160" height="16" fill="#111827"/>
    <line x1="0" y1="44" x2="1160" y2="44" stroke="#1E293B" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="28" cy="22" r="5.5" fill="#EF4444"/>
    <circle cx="46" cy="22" r="5.5" fill="#F59E0B"/>
    <circle cx="64" cy="22" r="5.5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="180" y="10" width="800" height="24" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="200" y="26" class="mono" font-size="11" fill="#64748B">https://quickeats.internal/order-tracking/QE-8942</text>
    <rect x="940" y="14" width="28" height="16" rx="3" fill="#10B981" fill-opacity="0.15"/>
    <text x="947" y="25" class="mono" font-size="9" font-weight="700" fill="#34D399">TLS</text>

    <!-- QuickEats In-App Navbar -->
    <rect y="45" width="1160" height="56" fill="#0F172A"/>
    <line x1="0" y1="101" x2="1160" y2="101" stroke="#1E293B" stroke-width="1"/>

    <!-- Brand Logo -->
    <rect x="28" y="58" width="30" height="30" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <!-- Utensils Glyph -->
    <path d="M37 66v5M39 66v5M41 66v5M37 71h4v7h-4zM47 66c0 3-2 5-2 8h-1c0-3-2-5-2-8h5z" fill="#34D399"/>
    <text x="68" y="79" class="sans" font-weight="800" font-size="19" fill="#F8FAFC" letter-spacing="-0.5">Quick<tspan fill="#10B981">Eats</tspan></text>

    <!-- Delivery Location Picker (From LocationModal.jsx) -->
    <g transform="translate(186, 58)">
      <rect width="180" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- MapPin -->
      <path d="M12 9a4 4 0 00-4 4c0 3 4 8 4 8s4-5 4-8a4 4 0 00-4-4zm0 6a2 2 0 110-4 2 2 0 010 4z" fill="#F97316"/>
      <text x="24" y="14" class="sans" font-size="8" font-weight="700" fill="#94A3B8" letter-spacing="0.5">DELIVER TO (HOME)</text>
      <text x="24" y="24" class="sans" font-size="10" font-weight="700" fill="#E2E8F0">Sector 62, Noida</text>
    </g>

    <!-- AI Search Input Bar (From HomePage.jsx: searchMenuItemsAi) -->
    <g transform="translate(382, 58)">
      <rect width="460" height="30" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
      <!-- Sparkle Icon -->
      <path d="M14 9l1.5 3.5L19 14l-3.5 1.5L14 19l-1.5-3.5L9 14l3.5-1.5z" fill="#38BDF8"/>
      <text x="28" y="20" class="sans" font-size="11" fill="#94A3B8">Ask Groq AI (e.g. &quot;High protein dinner with burger under ₹300&quot;)...</text>
      <rect x="408" y="6" width="44" height="18" rx="4" fill="#38BDF8" fill-opacity="0.12"/>
      <text x="414" y="18" class="mono" font-size="8" font-weight="700" fill="#38BDF8">LLAMA-3</text>
    </g>

    <!-- Cart Button & User Auth -->
    <g transform="translate(860, 58)">
      <rect width="130" height="30" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1"/>
      <!-- Shopping Bag -->
      <path d="M16 11h-2a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V13a2 2 0 00-2-2h-2m-6 0a3 3 0 016 0" stroke="#34D399" stroke-width="1.5"/>
      <text x="36" y="20" class="sans" font-size="11" font-weight="700" fill="#34D399">Cart (3) · ₹640</text>
    </g>

    <g transform="translate(1004, 58)">
      <rect width="128" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="8" fill="#334155"/>
      <text x="13" y="18" class="sans" font-size="9" font-weight="700" fill="#94A3B8">S</text>
      <text x="32" y="19" class="sans" font-size="10" font-weight="600" fill="#E2E8F0">Shivam (User)</text>
    </g>

    <!-- Main Workspace Content Area (Split View) -->
    <!-- Left Column: Menu & Restaurant Catalog -->
    <g transform="translate(28, 118)">
      <!-- Restaurant Header Card -->
      <rect width="660" height="96" rx="10" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <!-- Restaurant Avatar / Badge -->
      <rect x="16" y="16" width="64" height="64" rx="8" fill="#1E293B"/>
      <text x="36" y="54" class="sans" font-size="28">🍔</text>
      
      <text x="96" y="38" class="sans" font-size="16" font-weight="800" fill="#F8FAFC">The Burger Club · Artisanal Kitchen</text>
      <text x="96" y="56" class="sans" font-size="11" fill="#94A3B8">Gourmet Smash Burgers · Sides · Craft Shakes</text>
      
      <!-- Rating and Delivery Pill -->
      <rect x="96" y="64" width="56" height="20" rx="4" fill="#065F46"/>
      <text x="103" y="78" class="sans" font-size="10" font-weight="700" fill="#34D399">★ 4.8</text>
      <text x="160" y="78" class="mono" font-size="11" fill="#64748B">25–30 MINS · ₹200 FOR TWO</text>

      <!-- Menu Items List -->
      <!-- Item 1: Smash Burger -->
      <g transform="translate(0, 112)">
        <rect width="660" height="92" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="24" cy="28" r="4" fill="#EF4444"/>
        <text x="36" y="31" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Double Patty Signature Smash Burger</text>
        <text x="36" y="48" class="mono" font-size="12" font-weight="700" fill="#38BDF8">₹289</text>
        <text x="36" y="66" class="sans" font-size="10" fill="#94A3B8">Caramelized onions, sharp cheddar, secret burger sauce on toasted brioche.</text>
        
        <!-- Add Button -->
        <rect x="560" y="28" width="80" height="34" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1"/>
        <text x="584" y="50" class="sans" font-size="12" font-weight="700" fill="#34D399">+ ADD</text>
      </g>

      <!-- Item 2: Truffle Fries -->
      <g transform="translate(0, 216)">
        <rect width="660" height="92" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="24" cy="28" r="4" fill="#10B981"/>
        <text x="36" y="31" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Truffle Parmesan Hand-Cut Fries</text>
        <text x="36" y="48" class="mono" font-size="12" font-weight="700" fill="#38BDF8">₹179</text>
        <text x="36" y="66" class="sans" font-size="10" fill="#94A3B8">Crispy skin-on russet potatoes with black truffle oil and freshly grated parmesan.</text>
        
        <!-- In-Cart Counter Pill (From CartDrawer.jsx) -->
        <rect x="560" y="28" width="80" height="34" rx="6" fill="#059669"/>
        <text x="572" y="50" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">−</text>
        <text x="597" y="50" class="sans" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
        <text x="620" y="50" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">+</text>
      </g>

      <!-- Item 3: Avocado Salad -->
      <g transform="translate(0, 320)">
        <rect width="660" height="92" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="24" cy="28" r="4" fill="#10B981"/>
        <text x="36" y="31" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Avocado Citrus Salad with Honey Lime Dressing</text>
        <text x="36" y="48" class="mono" font-size="12" font-weight="700" fill="#38BDF8">₹249</text>
        <text x="36" y="66" class="sans" font-size="10" fill="#94A3B8">Hass avocado, baby spinach, orange segments, toasted pumpkin seeds.</text>
        
        <rect x="560" y="28" width="80" height="34" rx="6" fill="#059669"/>
        <text x="572" y="50" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">−</text>
        <text x="597" y="50" class="sans" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
        <text x="620" y="50" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">+</text>
      </g>

      <!-- Security Guarantee Banner: Server-Side Price Verification -->
      <g transform="translate(0, 424)">
        <rect width="660" height="42" rx="6" fill="#090D16" stroke="#059669" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="16" y="26" class="mono" font-size="10" fill="#34D399">✓ DEFENSIVE SECURITY: OrderService recalculates totals from DB price catalog (client tamper-proof)</text>
      </g>
    </g>

    <!-- Right Column: Real-Time Order Tracking & AI Assistant -->
    <g transform="translate(712, 118)">
      <!-- Order Live Tracking Card (From OrderTrackingPage.jsx & LiveMap.jsx) -->
      <rect width="420" height="248" rx="10" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <rect x="0" y="0" width="420" height="38" rx="10" fill="#111827"/>
      <rect x="0" y="26" width="420" height="12" fill="#111827"/>
      <line x1="0" y1="38" x2="420" y2="38" stroke="#1E293B" stroke-width="1"/>

      <text x="16" y="24" class="mono" font-size="11" font-weight="700" fill="#38BDF8">LIVE TRACKING · ORDER #QE-8942</text>
      <rect x="300" y="10" width="104" height="20" rx="4" fill="#059669" fill-opacity="0.2"/>
      <text x="310" y="24" class="mono" font-size="9" font-weight="700" fill="#34D399">STOMP/WS LIVE</text>

      <!-- Status Stepper Bar -->
      <g transform="translate(20, 56)">
        <line x1="20" y1="12" x2="360" y2="12" stroke="#334155" stroke-width="2"/>
        <line x1="20" y1="12" x2="260" y2="12" stroke="#10B981" stroke-width="2.5"/>

        <!-- Step 1: Placed -->
        <circle cx="20" cy="12" r="8" fill="#10B981"/>
        <text x="12" y="34" class="sans" font-size="9" font-weight="700" fill="#E2E8F0">Placed</text>

        <!-- Step 2: Preparing -->
        <circle cx="140" cy="12" r="8" fill="#10B981"/>
        <text x="125" y="34" class="sans" font-size="9" font-weight="700" fill="#E2E8F0">Kitchen</text>

        <!-- Step 3: Out for Delivery (Active) -->
        <circle cx="260" cy="12" r="10" fill="#10B981" stroke="#34D399" stroke-width="3"/>
        <text x="238" y="34" class="sans" font-size="9" font-weight="800" fill="#34D399">On the Way</text>

        <!-- Step 4: Delivered -->
        <circle cx="360" cy="12" r="8" fill="#334155"/>
        <text x="342" y="34" class="sans" font-size="9" font-weight="600" fill="#64748B">Delivered</text>
      </g>

      <!-- Courier Details & ETA -->
      <g transform="translate(20, 110)">
        <rect width="380" height="64" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
        <circle cx="32" cy="32" r="16" fill="#1E293B"/>
        <text x="26" y="37" class="sans" font-size="16">🛵</text>
        <text x="58" y="27" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">Rajesh Kumar · Rider</text>
        <text x="58" y="44" class="mono" font-size="10" fill="#94A3B8">Hero Splendor (UP 14 BT 4821)</text>
        <rect x="290" y="16" width="76" height="32" rx="6" fill="#059669" fill-opacity="0.15"/>
        <text x="306" y="32" class="sans" font-size="8" font-weight="700" fill="#94A3B8">EST. ARRIVAL</text>
        <text x="312" y="44" class="mono" font-size="11" font-weight="800" fill="#34D399">12 MINS</text>
      </g>

      <!-- Live Simulated GPS Coordinates -->
      <g transform="translate(20, 186)">
        <rect width="380" height="48" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="20" class="mono" font-size="9" fill="#64748B">SUBSCRIBED TOPIC: /topic/rider-location/8942</text>
        <text x="12" y="36" class="mono" font-size="10" fill="#38BDF8">LAT: 28.6289° N · LNG: 77.3688° E · HEADING: 142°</text>
      </g>

      <!-- Groq Llama 3 AI Support Chat Widget (From AiChatWidget.jsx) -->
      <g transform="translate(0, 264)">
        <rect width="420" height="202" rx="10" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
        <rect x="0" y="0" width="420" height="36" rx="10" fill="#111827"/>
        <rect x="0" y="24" width="420" height="12" fill="#111827"/>
        <line x1="0" y1="36" x2="420" y2="36" stroke="#1E293B" stroke-width="1"/>

        <!-- Sparkle + Header -->
        <circle cx="20" cy="18" r="6" fill="#38BDF8"/>
        <text x="34" y="22" class="sans" font-size="11" font-weight="700" fill="#F8FAFC">QuickEats AI Support (Groq Llama 3)</text>

        <!-- Message 1: Bot -->
        <g transform="translate(16, 48)">
          <rect width="340" height="42" rx="6" fill="#1E293B"/>
          <text x="12" y="18" class="sans" font-size="10" fill="#E2E8F0">Hello Shivam! Your order is on the way with Rajesh.</text>
          <text x="12" y="32" class="sans" font-size="10" fill="#94A3B8">Would you like me to share delivery instructions with the rider?</text>
        </g>

        <!-- Message 2: User Query -->
        <g transform="translate(90, 100)">
          <rect width="314" height="28" rx="6" fill="#059669"/>
          <text x="12" y="18" class="sans" font-size="10" font-weight="600" fill="#FFFFFF">Yes, please ask him to ring the bell twice.</text>
        </g>

        <!-- Message 3: Input Box -->
        <g transform="translate(16, 142)">
          <rect width="388" height="36" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
          <text x="14" y="23" class="sans" font-size="10" fill="#64748B">Type a message or question about order #8942...</text>
          <rect x="348" y="6" width="32" height="24" rx="4" fill="#10B981"/>
          <text x="360" y="22" class="sans" font-size="12" font-weight="700" fill="#FFFFFF">→</text>
        </g>
      </g>
    </g>

    <!-- Bottom Engineering Spec Strip -->
    <g transform="translate(0, 660)">
      <rect width="1160" height="44" fill="#090D16" rx="0"/>
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#1E293B" stroke-width="1"/>
      <text x="28" y="26" class="mono" font-size="10" fill="#64748B">SYSTEM SPECS:</text>
      <text x="120" y="26" class="mono" font-size="10" font-weight="700" fill="#E2E8F0">Spring Boot 3.2.3</text>
      <text x="248" y="26" class="mono" font-size="10" fill="#64748B">·</text>
      <text x="264" y="26" class="mono" font-size="10" font-weight="700" fill="#34D399">71 Executable @Test Methods</text>
      <text x="472" y="26" class="mono" font-size="10" fill="#64748B">·</text>
      <text x="488" y="26" class="mono" font-size="10" font-weight="700" fill="#38BDF8">Groq Llama 3 NLP</text>
      <text x="620" y="26" class="mono" font-size="10" fill="#64748B">·</text>
      <text x="636" y="26" class="mono" font-size="10" font-weight="700" fill="#F59E0B">STOMP WebSockets</text>
      <text x="776" y="26" class="mono" font-size="10" fill="#64748B">·</text>
      <text x="792" y="26" class="mono" font-size="10" font-weight="700" fill="#E2E8F0">Server-Side Tamper Defense</text>
    </g>
  </g>
</svg>
